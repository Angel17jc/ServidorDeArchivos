# Ejemplo de despliegue con HTTPS/TLS en el nodo L1 (NGINX). NO se usó en la práctica local:
# en localhost la API corre en http://127.0.0.1:8100 SIN cifrado.
#
# El TLS se termina en L1: el cliente habla HTTPS con NGINX y NGINX reenvía a L3 y L5
# por la red interna 192.168.10.0/24, que no está expuesta a internet.

# Todo el tráfico HTTP se redirige a HTTPS
server {
    listen 80;
    server_name tienda.ejemplo.edu.ec;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tienda.ejemplo.edu.ec;

    # Certificado emitido por una autoridad reconocida (por ejemplo, Let's Encrypt con certbot)
    ssl_certificate     /etc/letsencrypt/live/tienda.ejemplo.edu.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tienda.ejemplo.edu.ec/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # El navegador recordará usar solo HTTPS durante un año
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API protegida (tokens Bearer): solo viaja dentro de HTTPS
    location /api/ {
        proxy_pass http://192.168.10.13:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # Laravel confía en L1 (trustProxies) y genera URL https
    }

    # Descarga pública de archivos del Nodo L5 (solo lectura)
    location /files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://192.168.10.15:8080;
    }
}
