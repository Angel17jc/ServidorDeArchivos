# Bloque para el nodo L1 (NGINX): enruta /files/ directamente hacia L5.
# Solo se permite lectura (GET/HEAD); las cargas autenticadas pasan por /api/ -> L3.
#
# Si L1 está en la misma red Docker (red_nodos): 192.168.10.15:8080
# Si L5 corre en otro computador: IP_LAN_DEL_EQUIPO_L5:8080

upstream l5_files {
    server 192.168.10.15:8080;
}

server {
    # ... resto de la configuración de L1 (/ -> L2, /api/ -> L3) ...

    location /files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://l5_files;        # sin barra final: conserva el prefijo /files/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
    }

    location = /health/files {
        proxy_pass http://l5_files/health;
    }
}
